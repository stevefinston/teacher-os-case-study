<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 104" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Teacher OS — official logo lockup">
  <!--
    CANONICAL TEACHER OS LOGO (official brand mark + wordmark + tagline).
    This is the single approved brand identity for ALL Teacher OS surfaces:
    Hall Pass, Student Support Log, Grading Workspace, Student Directory, future
    modules, reports, PDF exports, application headers, documentation, and design
    artifacts. The mark geometry is identical to web/public/teacher-os-mark.svg.
    The previous apple mark is DEPRECATED — do not use it. Do not redesign,
    recolor, simplify, or substitute this mark. See design system §12, architecture
    §30, product vision (Branding).
  -->
  <defs>
    <!-- Official mark — geometry mirrors web/public/teacher-os-mark.svg (64x64). -->
    <g id="teacherOsMark">
      <rect x="2" y="2" width="60" height="60" rx="15" fill="#0c2233"/>
      <rect x="13" y="13" width="15" height="38" rx="7" fill="#ffffff"/>
      <rect x="33" y="18.5" width="17" height="11" rx="5.5" fill="#74C8CC"/>
      <rect x="33" y="34.5" width="17" height="11" rx="5.5" fill="#1AA362"/>
    </g>
  </defs>

  <!-- background kept transparent; mark tile is never transparent -->
  <use href="#teacherOsMark" transform="translate(8,20) scale(1.0)"/>

  <!-- wordmark -->
  <text x="92" y="56" font-size="34" font-weight="700" fill="#14283a" letter-spacing="0.2">Teacher OS</text>
  <!-- tagline: Insight. Clarity. Impact. (Clarity in brand blue) -->
  <text x="94" y="80" font-size="14" fill="#5a6b7d" letter-spacing="0.3">Insight.&#160;&#160;<tspan fill="#1f6fe0" font-weight="600">Clarity.</tspan>&#160;&#160;Impact.</text>
</svg>
