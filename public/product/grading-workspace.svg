    <text x="620" y="612">SCORE</text>
    <text x="740" y="612">STATUS</text>
    <text x="880" y="612">FEEDBACK</text>
  </g>
  <line x1="296" y1="624" x2="1436" y2="624" stroke="#e6ebf1"/>
  <!-- rows -->
  <g font-size="13.5">
    <text x="296" y="656" font-weight="600" fill="#14283a">Sam Ellis</text>
