  <path d="M1420 568l4 4 4-4" fill="none" stroke="#8aa0b4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- table header -->
  <g font-size="11.5" letter-spacing="0.6" font-weight="700" fill="#5a6b7d">
