    <line x1="296" y1="672" x2="1436" y2="672" stroke="#f1f5f9"/>

    <text x="296" y="704" font-weight="600" fill="#14283a">Maya Chen</text>
    <text x="620" y="704" fill="#41566a">7 / 12</text>
    <rect x="740" y="690" width="68" height="20" rx="9" fill="#e6f6ee"/>
    <text x="774" y="704" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f4f">Graded</text>
    <text x="880" y="704" fill="#8aa0b4" font-size="12.5">"Strong start — revisit how transport proteins move molecules across the membrane…"</text>
    <line x1="296" y1="720" x2="1436" y2="720" stroke="#f1f5f9"/>

    <text x="296" y="752" font-weight="600" fill="#14283a">Aiden Brooks</text>
    <text x="620" y="752" fill="#41566a">9 / 12</text>
    <rect x="740" y="738" width="68" height="20" rx="9" fill="#e6f6ee"/>
    <text x="774" y="752" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f4f">Graded</text>
    <text x="880" y="752" fill="#8aa0b4" font-size="12.5">"Clear explanations throughout. Your diagram of the cell membrane was especially…"</text>
    <line x1="296" y1="768" x2="1436" y2="768" stroke="#f1f5f9"/>

    <text x="296" y="800" font-weight="600" fill="#14283a">Jordan Diaz</text>
    <text x="620" y="800" fill="#41566a">—</text>
    <rect x="740" y="786" width="72" height="20" rx="9" fill="#eef2f6"/>
    <text x="776" y="800" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5a6b7d">Pending</text>
    <text x="880" y="800" fill="#8aa0b4" font-size="12.5">Not graded yet</text>
  </g>
  <text x="296" y="822" font-size="11.5" fill="#9aa9b8">Showing 4 of 42 · sorted by lowest score</text>

  <!-- footer — existing behavior note + existing sync state -->
  <text x="260" y="1011" font-size="11" fill="#9aa9b8">Grading is incremental — rows that are already graded are never changed.</text>
  <circle cx="1352" cy="1004" r="4" fill="#1aa362"/>
  <text x="1472" y="1008" text-anchor="end" font-size="12" fill="#5a6b7d">Synced just now</text>
</svg>
