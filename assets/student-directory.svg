<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Teacher OS Student Directory workspace design showing the canonical shell, directory summary, and active student table">
  <!--
    STUDENT DIRECTORY PR-5 — proposed Professional Workspace reference.
    Synthetic names only. No production student data appears in this artifact.
    No production code is built or changed by this artifact.
  -->
  <defs>
